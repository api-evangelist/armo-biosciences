description: 'ARMO BioSciences was a clinical-stage immuno-oncology biopharmaceutical company based in
  Redwood City, California, developing biologic therapeutics that activate a patient''s own immune system
  to fight cancer. Its lead candidate was pegilodecakin (AM0010), a PEGylated recombinant human interleukin-10
  (IL-10) evaluated across solid tumors. Backed by GV and Kleiner Perkins, the company IPO''d on NASDAQ
  in 2018 and was acquired by Eli Lilly and Company that same year for approximately $1.6 billion; its
  former web domain now redirects to lilly.com. As a life-sciences therapeutics developer it exposes no
  public developer API, SDK, or documentation surface. This profile is retained in the API Evangelist
  network as a portfolio/acquisition record rather than an active API provider.'
